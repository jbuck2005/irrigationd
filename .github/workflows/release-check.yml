name: Release check

# A release tag must have its own changelog heading, so the notes match the code.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag and changelog agree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag $TAG is not vX.Y.Z"
            exit 1
          fi
          if ! grep -Eq "^## ${version//./\\.} - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version - YYYY-MM-DD' heading"
            exit 1
          fi
          echo "Tag and changelog both say $version"
